backend:
  name: turbo-github
  turbo_site_id: 3ab099f1-f383-4e28-b093-c3830496e6ff

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: fr

# Mode éditorial : un enregistrement crée une branche et une pull request au
# lieu d'écrire directement sur main. La fiche n'est donc pas construite par le
# site tant qu'elle n'est pas publiée, et elle passe par les états Brouillon /
# En relecture / Prêt.
publish_mode: editorial_workflow

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "accueil"
        label: "Accueil"
        file: "src/content/pages/accueil.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Description pour les moteurs de recherche"
            name: "subtitle"
            widget: "text"
            required: false
            hint: "N'apparaît pas dans le bandeau : sert de description dans les résultats Google et les partages."
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - label: "Sections (texte + photo, en colonnes alternées)"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Titre de la section", name: "heading", widget: "string" }
              - label: "Texte"
                name: "text"
                widget: "text"
                hint: "Une ligne vide sépare deux paragraphes."
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "Sans photo, la section s'affiche en pleine largeur. Format conseillé : 4:3, 1600 px de large, WebP."
              - label: "Description de la photo"
                name: "imageAlt"
                widget: "string"
                required: false
                hint: "Lu par les lecteurs d'écran et utilisé par Google Images."
              - { label: "Bouton — texte", name: "linkLabel", widget: "string", required: false }
              - label: "Bouton — lien"
                name: "linkUrl"
                widget: "string"
                required: false
                hint: "Un chemin interne, par exemple /atelier, /occasions ou /contact."

      - name: "atelier"
        label: "Atelier"
        file: "src/content/pages/atelier.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Description pour les moteurs de recherche"
            name: "subtitle"
            widget: "text"
            required: false
            hint: "N'apparaît pas dans le bandeau : sert de description dans les résultats Google et les partages."
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - { label: "Contenu libre (facultatif, sous l'accroche)", name: "body", widget: "markdown", required: false }
          - label: "Carte — Les bois"
            name: "bois"
            widget: "object"
            required: false
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Facultative. 4:3, 1600 px de large, WebP."
              - label: "Description de la photo"
                name: "photoAlt"
                widget: "string"
                required: false
                hint: "Lu par les lecteurs d'écran."
              - { label: "Contenu", name: "body", widget: "markdown", required: false }
          - label: "Carte — Les cuivres"
            name: "cuivres"
            widget: "object"
            required: false
            fields:
              - { label: "Titre", name: "title", widget: "string" }
              - { label: "Sous-titre", name: "subtitle", widget: "string", required: false }
              - label: "Photo"
                name: "photo"
                widget: "image"
                required: false
                hint: "Facultative. 4:3, 1600 px de large, WebP."
              - label: "Description de la photo"
                name: "photoAlt"
                widget: "string"
                required: false
                hint: "Lu par les lecteurs d'écran."
              - { label: "Contenu", name: "body", widget: "markdown", required: false }
      - name: "occasions"
        label: "Occasions (page)"
        file: "src/content/pages/occasions.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Description pour les moteurs de recherche"
            name: "subtitle"
            widget: "text"
            required: false
            hint: "N'apparaît pas dans le bandeau : sert de description dans les résultats Google et les partages."
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "contact"
        label: "Contact"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - { label: "Introduction", name: "body", widget: "markdown" }

      - name: "mentions-legales"
        label: "Mentions légales"
        file: "src/content/pages/mentions-legales.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "location"
        label: "Location d'instruments"
        file: "src/content/pages/location.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
          - { label: "Frais de dossier (€)", name: "frais", widget: "number", required: false, hint: "Affiché dans le bandeau « L'essentiel »." }
          - { label: "Conditions", name: "body", widget: "markdown", required: false }

      - name: "confidentialite"
        label: "Politique de confidentialité"
        file: "src/content/pages/confidentialite.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "instruments"
    label: "Instruments d'occasion"
    folder: "src/content/occasions"
    create: true
    slug: "{{slug}}"
    fields:
      - label: "Instrument (nom, marque, référence)"
        name: "title"
        widget: "string"
        hint: "Une seule ligne : par exemple « Saxhorn basse Courtois AC164 n°12705 »."
      - { label: "Prix (€)", name: "prix", widget: "number", required: false }
      - label: "État"
        name: "etat"
        widget: "select"
        required: false
        options: ["État neuf", "Très bon état", "Bon état", "En état"]
        hint: "Peut rester vide dans un brouillon ; à renseigner avant publication."
      - label: "Vendu"
        name: "vendu"
        widget: "boolean"
        default: false
        required: false
        hint: "À cocher quand l'instrument est parti. La fiche reste en ligne avec un bandeau « Vendu », mais il disparaît de la liste des occasions."
      - label: "Photo principale"
        name: "photo"
        widget: "image"
        required: false
        hint: "Cadrage horizontal 4:3, 1600 px de large, WebP, moins de 300 Ko."
      - label: "Galerie"
        name: "galerie"
        widget: "list"
        required: false
        hint: "La photo principale ouvre le carrousel, puis ces photos dans l'ordre. Le glisser-déposer change l'ordre. Même format que la photo principale : 4:3, 1600 px de large, WebP. Astuce : déposez d'abord tous les fichiers d'un coup dans la médiathèque (bouton « Media » en haut), puis ajoutez-les ici — chaque entrée n'accepte qu'un fichier."
        field: { label: "Photo", name: "image", widget: "image" }
      - label: "Description"
        name: "body"
        widget: "markdown"
        required: false
        hint: "Peut rester vide dans un brouillon ; à renseigner avant publication."

  - name: "locations"
    label: "Location — instruments"
    label_singular: "Instrument loué"
    folder: "src/content/locations"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Instrument", name: "title", widget: "string", hint: "Ex. : Saxophone alto" }
      - label: "Famille"
        name: "famille"
        widget: "select"
        options: ["Saxophone", "Clarinette", "Flûte", "Trompette", "Cor", "Autre"]
      - { label: "Modèle", name: "modele", widget: "string", required: false }
      - { label: "Mensualité (€)", name: "mensualite", widget: "number", required: false, hint: "Laisser vide affiche « sur demande »." }
      - { label: "Caution — valeur de l'instrument (€)", name: "caution", widget: "number", required: false, hint: "Montant du chèque de caution, égal à la valeur de l'instrument." }
      - label: "État"
        name: "etat"
        widget: "select"
        required: false
        options: ["État neuf", "Très bon état", "Bon état", "En état"]
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - label: "Disponible"
        name: "disponible"
        widget: "boolean"
        default: true
        required: false
        hint: "Décocher quand l'instrument est loué : il reste listé, avec le badge « Loué »."
