backend:
  name: turbo-github
  turbo_site_id: 3ab099f1-f383-4e28-b093-c3830496e6ff

media_folder: "public/images/uploads"
public_folder: "/images/uploads"

locale: fr

collections:
  - name: "pages"
    label: "Pages"
    files:
      - name: "accueil"
        label: "Accueil"
        file: "src/content/pages/accueil.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - label: "Sections (texte + photo, en colonnes alternées)"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Titre de la section", name: "heading", widget: "string" }
              - label: "Texte"
                name: "text"
                widget: "text"
                hint: "Une ligne vide sépare deux paragraphes."
              - label: "Photo"
                name: "image"
                widget: "image"
                required: false
                hint: "Sans photo, la section s'affiche en pleine largeur."
              - label: "Description de la photo"
                name: "imageAlt"
                widget: "string"
                required: false
                hint: "Lu par les lecteurs d'écran et utilisé par Google Images."
              - { label: "Bouton — texte", name: "linkLabel", widget: "string", required: false }
              - label: "Bouton — lien"
                name: "linkUrl"
                widget: "string"
                required: false
                hint: "Un chemin interne, par exemple /atelier, /occasions ou /contact."

      - name: "atelier"
        label: "Atelier"
        file: "src/content/pages/atelier.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "atelier-bois"
        label: "Atelier — Les bois"
        file: "src/content/pages/atelier-bois.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "atelier-cuivres"
        label: "Atelier — Les cuivres"
        file: "src/content/pages/atelier-cuivres.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "occasions"
        label: "Occasions (page)"
        file: "src/content/pages/occasions.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Sous-titre", name: "subtitle", widget: "text" }
          - label: "Phrase d'accroche"
            name: "tagline"
            widget: "text"
            required: false
            hint: "Facultative. S'affiche sous un filet doré ; plusieurs lignes possibles."
          - { label: "Contenu", name: "body", widget: "markdown" }

      - name: "contact"
        label: "Contact"
        file: "src/content/pages/contact.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Introduction", name: "body", widget: "markdown" }

      - name: "mentions-legales"
        label: "Mentions légales"
        file: "src/content/pages/mentions-legales.md"
        fields:
          - { label: "Titre", name: "title", widget: "string" }
          - { label: "Contenu", name: "body", widget: "markdown" }

  - name: "instruments"
    label: "Instruments d'occasion"
    folder: "src/content/occasions"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Nom de l'instrument", name: "title", widget: "string" }
      - { label: "Marque", name: "marque", widget: "string", required: false }
      - { label: "Prix (€)", name: "prix", widget: "number", required: false }
      - { label: "État", name: "etat", widget: "select", options: ["Neuf", "Très bon état", "Bon état", "À réviser"] }
      - { label: "Photo principale", name: "photo", widget: "image", required: false }
      - label: "Galerie"
        name: "galerie"
        widget: "list"
        required: false
        hint: "La photo principale ouvre le carrousel, puis ces photos dans l'ordre. Le glisser-déposer change l'ordre."
        field: { label: "Photo", name: "image", widget: "image" }
      - { label: "Description", name: "body", widget: "markdown" }
